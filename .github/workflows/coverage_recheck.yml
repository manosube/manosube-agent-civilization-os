name: Saved coverage recheck

# One scoped repair record; future source changes cannot reuse this run's evidence.
on:
  push:
    branches: [codex/external-readiness-20261009]
    paths:
      - pyproject.toml
      - scripts/recheck_saved_coverage.py
      - .github/workflows/coverage_recheck.yml
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Fully successful five-partition test run
        required: true
        default: '37897576051'

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '37897576051' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements-ci.txt coverage
      - name: Refuse source changes or incomplete previous tests
        run: python scripts/recheck_saved_coverage.py --run-id "$SOURCE_RUN_ID" --validate-only
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: test-results-*
          path: build/recheck
      - name: Check inventories, completed JUnit and coverage
        run: python scripts/recheck_saved_coverage.py --run-id "$SOURCE_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verified-coverage-recheck
          path: |
            build/recheck/coverage.json
            build/recheck/validation.json
          if-no-files-found: warn
