name: Runtime observation transport (manual dispatch)

# Issue #105 (transport-independent runtime observation), adoption
# ADOPT_I105_ACTIONS_INDEPENDENT_AB_UNATTENDED_OBSERVATION. Corrected by PR #108 Structural
# Review Round 1, F5 (workflow-input shell injection), and by Structural Review Round 2,
# SR2-F1 (a real, executing "observe" job alongside the original render-only one).
#
# This is the GitHub Actions *transport* for the one canonical Runtime Observation route
# (manosube_agent_civilization.runtime.observe_runtime_target) -- it never becomes a second
# owner of what an observation means, and it never classifies observation success itself.
# Two jobs, both reaching that identical canonical route through
# scripts/runtime_observation_transport.py, never a second, parallel implementation:
#
# - render-command: renders the identical bounded SSH command a Human operator's own manual
#   fallback would run, through a grant supplied at dispatch time, and publishes the result to
#   this run's own job summary. Never opens a socket, spawns an SSH process, or reaches any
#   target -- a pure render.
# - observe (PR #108 SR2-F1): genuinely *executes* the canonical observation route from inside
#   this Actions runner -- the real gap the first delivery's own "observe" CLI subcommand left
#   open by refusing every transport except PREAUTHORIZED_UNATTENDED_SSH, which made a real
#   Actions-dispatched observation structurally impossible to ever actually perform. An
#   already-dispatched Actions job a Human authorized is itself that attempt's own
#   authorization act (the identical reasoning the grant's own PREAUTHORIZED_UNATTENDED_SSH
#   mode already rests on for the fully unattended case), so the grant supplied at dispatch
#   time must explicitly permit GITHUB_ACTIONS for this job to proceed past its own
#   construction-time gate.
#
# Deliberately workflow_dispatch only -- no push/pull_request/schedule trigger. Creating or
# running this workflow does not by itself authorize a real private/production VPS
# connection, provision a key, or configure a secret: every input below is read and validated
# before anything is attempted, and neither job holds a credential or a secret of its own. A
# downstream project that binds a real target does so under its own separate, explicit
# authorization and its own repository secrets -- never this one, which ships with none. This
# repository itself ships no bound Project Store, so dispatching either job here will
# correctly fail closed at grant verification (no real Project Binding to verify a signature
# against) rather than render a false command or fabricate an observation -- a downstream
# deployment supplies its own store_root pointing at its own checked-out or restored Store.
#
# PR #108 SR1 F5: every dispatch input below is passed to its own shell step through `env:`,
# never interpolated directly into that step's own `run:` script text. GitHub Actions expands
# `${{ github.event.inputs.* }}` *before* the shell ever sees the script, so a value
# containing `$(...)` or backticks, interpolated directly into script source, would be
# evaluated as a real command by the shell that runs the script -- not merely passed as data.
# Routing every input through `env:` instead means the shell only ever sees "$NAME", an
# ordinary variable reference whose *value* is never re-parsed as further shell syntax. The
# ``observe`` job's own further inputs (target_identity_json, permitted_fields,
# timeout_seconds) follow this identical discipline, with no exception.

on:
  workflow_dispatch:
    inputs:
      grant_json:
        description: >-
          The bounded-SSH-observation grant (JSON object; see
          docs/runtime_observation_transports.md). Read and validated; never executed by the
          render-command job, and executed by the observe job only once this exact grant
          itself genuinely verifies and explicitly permits GITHUB_ACTIONS.
        required: true
      now:
        description: "Canonical UTC timestamp (YYYY-MM-DDTHH:MM:SSZ) this run treats as 'now'."
        required: true
      store_root:
        description: >-
          Path (within this runner's own checkout/workspace) to the real, already-bound
          Project Store this grant's own project_id/project_binding_id resolve against. This
          repository ships none; a downstream deployment that wants either job to actually
          verify (not merely attempt to verify) a grant provides one via an earlier step.
        required: true
      project_id:
        description: "The grant's own declared project_id -- must match the real Store's own."
        required: true
      project_binding_id:
        description: >-
          The grant's own declared project_binding_id -- must match the real Store's own.
        required: true
      target_identity_json:
        description: >-
          The explicit runtime target identity (JSON object) the observe job's own attempt
          names -- read by the observe job only; the render-command job never reads it.
        required: false
        default: "{}"
      permitted_fields:
        description: >-
          Comma-separated field names the observe job's own Observation Boundary permits --
          read by the observe job only.
        required: false
        default: "hostname"
      timeout_seconds:
        description: "The observe job's own Boundary timeout_seconds -- read by the observe job only."
        required: false
        default: "30"
      proof_mode:
        description: >-
          Issue #105 follow-on (ADOPT_I105_ISOLATED_ACTIONS_PROOF_SETTINGS_20261006): explicit
          opt-in for the isolated-actions-proof job below. "false" (the default) runs neither
          that job nor any of the inputs it reads -- this exact dispatch then behaves exactly
          as it always has. Only "true" runs it, and only when a reviewer has already set up
          the separate trial-only SSH secret this guide's own setup instructions describe.
        required: false
        default: "false"
      trial_ssh_host:
        description: "isolated-actions-proof only: the real target's own SSH host."
        required: false
        default: ""
      trial_ssh_port:
        description: "isolated-actions-proof only: the real target's own SSH port."
        required: false
        default: "22"
      trial_ssh_user:
        description: >-
          isolated-actions-proof only: the SSH user the trial-only key's own forced-command
          authorization entry is restricted under -- never the account any production key uses.
        required: false
        default: ""
      trial_ssh_known_hosts:
        description: >-
          isolated-actions-proof only: this exact target's own pinned SSH host key line(s), in
          ``known_hosts`` format -- never accepted on trust at connection time.
        required: false
        default: ""
      trial_probe_identity:
        description: >-
          isolated-actions-proof only: OS_HEALTH_SNAPSHOT_BOUNDED or SOURCE_LOG_EXCERPT_BOUNDED.
        required: false
        default: "OS_HEALTH_SNAPSHOT_BOUNDED"
      trial_deployment_fingerprint:
        description: >-
          isolated-actions-proof only: the real target's own currently-configured identity
          value (see docs/runtime_observation_transports.md §5) -- never fabricated here.
        required: false
        default: ""
      trial_deployment_config_fingerprint:
        description: >-
          isolated-actions-proof only: the real target's own effective three-path
          deployment_config_fingerprint (see docs/runtime_observation_transports.md §5).
        required: false
        default: ""
      trial_permitted_fields:
        description: "isolated-actions-proof only: comma-separated permitted field names."
        required: false
        default: "hostname"
      trial_grant_validity_seconds:
        description: >-
          isolated-actions-proof only: this trial's own bounded short-lived grant window, in
          seconds from this run's own dispatch instant.
        required: false
        default: "600"
      trial_fixture_dispatch_status_sequence:
        description: >-
          isolated-actions-proof only: a comma-separated, explicitly synthetic sequence of
          observed GitHub Actions dispatch facts (e.g. "UNAVAILABLE,UNAVAILABLE,UNAVAILABLE")
          -- a FIXTURE input for the independent fallback-controller exercise, never a claim
          that a real GitHub outage or quota exhaustion actually occurred.
        required: false
        default: "UNAVAILABLE,UNAVAILABLE,UNAVAILABLE"
      trial_start_deadline_seconds:
        description: >-
          isolated-actions-proof only: the independent fallback controller's own bounded
          wall-clock start deadline, in seconds.
        required: false
        default: "5"

concurrency:
  group: runtime-observation-transport
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-command:
    # Issue #105 follow-on, PR #111 Structural Review Round 1, F4: a `proof_mode: "true"`
    # dispatch names the isolated-actions-proof job's own `trial_*` inputs, never this job's
    # `grant_json`/`store_root`/`project_id`/`project_binding_id` -- running this job anyway on
    # such a dispatch would only ever fail on those unset/irrelevant generic inputs, a spurious
    # failure this exact condition prevents. Every dispatch that leaves `proof_mode` at its
    # default `"false"` (every dispatch that predates this condition's own existence included)
    # is unaffected: this job runs exactly as it always has.
    if: github.event.inputs.proof_mode != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this package (editable, no extras)
        run: pip install -e .

      - name: Write the dispatched grant to a file
        run: echo "$GRANT_JSON" > grant.json
        env:
          GRANT_JSON: ${{ github.event.inputs.grant_json }}

      - name: Render the bounded SSH command (no connection attempted)
        id: render
        run: |
          python scripts/runtime_observation_transport.py render-command \
            --grant-file grant.json \
            --store-root "$STORE_ROOT" \
            --schema-root 01_SCHEMA \
            --project-id "$PROJECT_ID" \
            --project-binding-id "$PROJECT_BINDING_ID" \
            --now "$NOW" \
            > render_result.json
          cat render_result.json
        env:
          NOW: ${{ github.event.inputs.now }}
          STORE_ROOT: ${{ github.event.inputs.store_root }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
          PROJECT_BINDING_ID: ${{ github.event.inputs.project_binding_id }}

      - name: Publish result to job summary
        if: always()
        run: |
          {
            echo "## Runtime observation transport -- render-command"
            echo
            echo "Rendered a command string only. No connection was attempted by this job."
            echo
            echo '```json'
            cat render_result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  observe:
    # PR #108 Structural Review Round 2, SR2-F1: this job genuinely *executes* the canonical
    # observation route (manosube_agent_civilization.runtime.observe_runtime_target) from
    # inside this Actions runner -- not a render. The dispatched grant must itself genuinely
    # verify and explicitly permit GITHUB_ACTIONS (scripts/runtime_observation_transport.py's
    # own ``observe`` subcommand enforces this at SshRuntimeAdapter's own construction-time
    # gate); this job supplies no credential or secret of its own, and this repository ships
    # no bound Project Store, so a real dispatch here correctly fails closed at grant
    # verification rather than reaching any target -- demonstrating genuine invocation of the
    # canonical route from within a real Actions runner, honestly, with no target to reach.
    #
    # PR #111 Structural Review Round 1, F4: the identical `proof_mode` gate render-command
    # now carries, for the identical reason -- this job's own generic inputs are meaningless on
    # a proof_mode dispatch, which names only the isolated-actions-proof job's own `trial_*`
    # inputs.
    if: github.event.inputs.proof_mode != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this package (editable, no extras)
        run: pip install -e .

      - name: Write the dispatched grant and target identity to files
        run: |
          echo "$GRANT_JSON" > grant.json
          echo "$TARGET_IDENTITY_JSON" > target_identity.json
        env:
          GRANT_JSON: ${{ github.event.inputs.grant_json }}
          TARGET_IDENTITY_JSON: ${{ github.event.inputs.target_identity_json }}

      - name: Perform the bounded observation now (real canonical route, real execution)
        id: observe
        # This job's own dispatch is itself the fact that Actions is available for this
        # attempt -- there is no further "is Actions available" question to ask from inside
        # the job that is the answer to it, so --actions-status is always AVAILABLE here and
        # no --requested-transport is given, resolving to GITHUB_ACTIONS automatically
        # (transport_control.select_transport's own existing, unchanged preference order).
        # A nonzero exit here means the observation genuinely refused or failed -- expected and
        # honest for this repository's own unbound Store -- so the job's own overall result is
        # decided by the summary step below, never by this one step alone.
        continue-on-error: true
        run: |
          python scripts/runtime_observation_transport.py observe \
            --grant-file grant.json \
            --target-identity-file target_identity.json \
            --store-root "$STORE_ROOT" \
            --schema-root 01_SCHEMA \
            --project-id "$PROJECT_ID" \
            --project-binding-id "$PROJECT_BINDING_ID" \
            --permitted-fields "$PERMITTED_FIELDS" \
            --now "$NOW" \
            --timeout-seconds "$TIMEOUT_SECONDS" \
            --actions-status AVAILABLE \
            > observe_result.json
          cat observe_result.json
        env:
          NOW: ${{ github.event.inputs.now }}
          STORE_ROOT: ${{ github.event.inputs.store_root }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
          PROJECT_BINDING_ID: ${{ github.event.inputs.project_binding_id }}
          PERMITTED_FIELDS: ${{ github.event.inputs.permitted_fields }}
          TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds }}

      - name: Publish result to job summary
        if: always()
        run: |
          {
            echo "## Runtime observation transport -- observe (real execution)"
            echo
            echo "This job genuinely invoked the canonical observation route through the"
            echo "GITHUB_ACTIONS transport -- never a render. This repository ships no bound"
            echo "Project Store, so this run correctly fails closed at grant verification (no"
            echo "real Project Binding exists here to verify a signature against) rather than"
            echo "reaching any target; a downstream deployment with a real, bound Store would"
            echo "see this identical job genuinely reach its own real target instead."
            echo
            echo '```json'
            cat observe_result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  isolated-actions-proof:
    # Issue #105 follow-on (ADOPT_I105_ISOLATED_ACTIONS_PROOF_SETTINGS_20261006): an explicit,
    # manual-dispatch-only opt-in -- this job never runs unless this exact dispatch's own
    # `proof_mode` input is literally "true". Every other dispatch of this workflow (every
    # dispatch that ever existed before this job was added) runs neither this job nor touches
    # any of the inputs/secret it reads; the two jobs above are entirely unchanged.
    #
    # What this job does: mints one disposable, isolated Project Binding/Store/Authority and
    # one bounded short-lived grant via scripts/runtime_observation_proof.py (never the
    # installed package, never a second Runtime/Authority/Evidence owner -- see that script's
    # own module docstring), then exercises the real target through the existing, unmodified
    # scripts/runtime_observation_transport.py `observe` (the real GITHUB_ACTIONS transport)
    # and `run-controller` (the genuinely independent Actions-to-SSH fallback controller,
    # exercised here against an explicitly FIXTURE-labelled dispatch-status sequence, falling
    # back to a real PREAUTHORIZED_UNATTENDED_SSH attempt only once the grant itself already,
    # explicitly authorizes it and the controller's own bounded deadline is reached).
    #
    # What this job never does: it never generates, rotates, or uploads any SSH key or GitHub
    # secret -- it only *reads* the one named secret below, which an operator must already have
    # set up through the reviewed setup instructions in
    # docs/runtime_observation_transports.md, and only that secret's own *private* half ever
    # touches this runner's disk, written with 600 permissions, never echoed to this job's own
    # log or summary, and removed again before this job ends. Host verification is pinned from
    # this exact dispatch's own `trial_ssh_known_hosts` input, never accepted on trust. This job
    # never installs a persistent runner, changes a VPS service or package, accesses downstream
    # application/business data, merges anything, marks any Pull Request Ready, or closes
    # Issue #105 -- none of those actions exist anywhere in this job's own steps.
    if: github.event.inputs.proof_mode == 'true'
    needs: []
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install this package (editable, no extras)
        run: pip install -e .

      - name: Set up the trial-only SSH key, pinned host verification, and identity selection
        # PR #111 Structural Review Round 1, F1: render_ssh_command_argv (out of scope for this
        # correction -- it is installed-package Runtime code) builds a plain
        # `ssh -o BatchMode=yes ... user@host '<command>'` invocation with no `-i`/IdentityFile
        # flag and no `-F` of its own, so `ssh` reads its own default `~/.ssh/config` --
        # without one naming the trial key, it would silently fall back to whatever ambient
        # identity this runner happens to carry (an ssh-agent key, a default id_* file), never
        # genuinely proving the trial-only key itself authenticated. Writing one `Host` block
        # scoped to this exact trial host, with `IdentitiesOnly yes`, makes `ssh` select *only*
        # this file for that host -- no ambient identity is ever considered as a fallback.
        run: |
          mkdir -m 700 -p ~/.ssh
          umask 077
          printf '%s\n' "$TRIAL_SSH_PRIVATE_KEY" > ~/.ssh/isolated_trial_proof_key
          chmod 600 ~/.ssh/isolated_trial_proof_key
          printf '%s\n' "$TRIAL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Fail closed, before anything else, if the written key is missing or not a valid
          # private key -- never logging the key's own bytes either way. "A file-exists
          # assertion is insufficient" (the adopted handoff's own words): this independently
          # asks ssh-keygen to actually parse it.
          if ! ssh-keygen -y -f ~/.ssh/isolated_trial_proof_key > /dev/null 2>&1; then
            echo "::error::the trial-only SSH key is missing or is not a valid private key"
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host $TRIAL_SSH_HOST
            Port $TRIAL_SSH_PORT
            User $TRIAL_SSH_USER
            IdentityFile ~/.ssh/isolated_trial_proof_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

          # Permanent proof companion to tests/integration/runtime/
          # test_runtime_observation_proof.py's own real `ssh -G` assertions (F1): prove this
          # exact runner's own generated config genuinely selects the trial identity for this
          # exact host -- never only that the config/key files exist.
          # `ssh -G` prints an IdentityFile directive's own value verbatim, never tilde-
          # expanded -- compared here against the identical literal text this step's own
          # config just wrote, never an expanded path (which `ssh -G` would never actually
          # print, making any such comparison always false).
          selected_identity=$(ssh -G -F ~/.ssh/config "$TRIAL_SSH_HOST" | awk '$1=="identityfile"{print $2}' | tail -n1)
          expected_identity='~/.ssh/isolated_trial_proof_key'
          if [ "$selected_identity" != "$expected_identity" ]; then
            echo "::error::ssh -G does not select the trial-only identity for host $TRIAL_SSH_HOST (got: $selected_identity)"
            exit 1
          fi
        env:
          # Never logged, never echoed -- see this job's own top-level comment. The secret
          # name itself is a setup-instructions contract, not a value this workflow invents.
          TRIAL_SSH_PRIVATE_KEY: ${{ secrets.RUNTIME_OBSERVATION_TRIAL_SSH_PRIVATE_KEY }}
          TRIAL_SSH_KNOWN_HOSTS: ${{ github.event.inputs.trial_ssh_known_hosts }}
          TRIAL_SSH_HOST: ${{ github.event.inputs.trial_ssh_host }}
          TRIAL_SSH_PORT: ${{ github.event.inputs.trial_ssh_port }}
          TRIAL_SSH_USER: ${{ github.event.inputs.trial_ssh_user }}

      - name: Bootstrap a disposable isolated Project Binding, Store, and bounded grant
        id: bootstrap
        run: |
          mkdir -p "$RUNNER_TEMP/isolated-proof-store" "$RUNNER_TEMP/isolated-proof-out"
          python scripts/runtime_observation_proof.py bootstrap \
            --store-root "$RUNNER_TEMP/isolated-proof-store" \
            --out-dir "$RUNNER_TEMP/isolated-proof-out" \
            --now "$NOW" \
            --grant-validity-seconds "$TRIAL_GRANT_VALIDITY_SECONDS" \
            --host "$TRIAL_SSH_HOST" \
            --port "$TRIAL_SSH_PORT" \
            --user "$TRIAL_SSH_USER" \
            --probe-identity "$TRIAL_PROBE_IDENTITY" \
            --deployment-fingerprint "$TRIAL_DEPLOYMENT_FINGERPRINT" \
            --deployment-config-fingerprint "$TRIAL_DEPLOYMENT_CONFIG_FINGERPRINT" \
            --permitted-fields "$TRIAL_PERMITTED_FIELDS" \
            > bootstrap_result.json
          cat bootstrap_result.json
          python -c "
          import json
          with open('$RUNNER_TEMP/isolated-proof-out/project.json') as stream:
              project = json.load(stream)
          with open('$GITHUB_ENV', 'a', encoding='utf-8') as env_file:
              env_file.write(f'ISOLATED_PROOF_PROJECT_ID={project[\"project_id\"]}\n')
              env_file.write(
                  f'ISOLATED_PROOF_PROJECT_BINDING_ID={project[\"project_binding_id\"]}\n'
              )
          "
        env:
          NOW: ${{ github.event.inputs.now }}
          TRIAL_GRANT_VALIDITY_SECONDS: ${{ github.event.inputs.trial_grant_validity_seconds }}
          TRIAL_SSH_HOST: ${{ github.event.inputs.trial_ssh_host }}
          TRIAL_SSH_PORT: ${{ github.event.inputs.trial_ssh_port }}
          TRIAL_SSH_USER: ${{ github.event.inputs.trial_ssh_user }}
          TRIAL_PROBE_IDENTITY: ${{ github.event.inputs.trial_probe_identity }}
          TRIAL_DEPLOYMENT_FINGERPRINT: ${{ github.event.inputs.trial_deployment_fingerprint }}
          TRIAL_DEPLOYMENT_CONFIG_FINGERPRINT: ${{ github.event.inputs.trial_deployment_config_fingerprint }}
          TRIAL_PERMITTED_FIELDS: ${{ github.event.inputs.trial_permitted_fields }}

      - name: Real Actions-transport trial (genuine execution, real target)
        id: actions_trial
        continue-on-error: true
        run: |
          python scripts/runtime_observation_transport.py observe \
            --grant-file "$RUNNER_TEMP/isolated-proof-out/grant.json" \
            --target-identity-file "$RUNNER_TEMP/isolated-proof-out/target_identity.json" \
            --store-root "$RUNNER_TEMP/isolated-proof-store" \
            --schema-root 01_SCHEMA \
            --project-id "$ISOLATED_PROOF_PROJECT_ID" \
            --project-binding-id "$ISOLATED_PROOF_PROJECT_BINDING_ID" \
            --permitted-fields "$TRIAL_PERMITTED_FIELDS" \
            --now "$NOW" \
            --actions-status AVAILABLE \
            > actions_trial_result.json
          cat actions_trial_result.json
        env:
          NOW: ${{ github.event.inputs.now }}
          TRIAL_PERMITTED_FIELDS: ${{ github.event.inputs.trial_permitted_fields }}

      - name: Independent fallback-controller exercise (FIXTURE dispatch facts; real SSH only once authorized)
        id: fallback_trial
        continue-on-error: true
        run: |
          python scripts/runtime_observation_transport.py run-controller \
            --grant-file "$RUNNER_TEMP/isolated-proof-out/grant.json" \
            --target-identity-file "$RUNNER_TEMP/isolated-proof-out/target_identity.json" \
            --store-root "$RUNNER_TEMP/isolated-proof-store" \
            --schema-root 01_SCHEMA \
            --project-id "$ISOLATED_PROOF_PROJECT_ID" \
            --project-binding-id "$ISOLATED_PROOF_PROJECT_BINDING_ID" \
            --permitted-fields "$TRIAL_PERMITTED_FIELDS" \
            --now "$NOW" \
            --fixture-dispatch-status-sequence "$TRIAL_FIXTURE_DISPATCH_STATUS_SEQUENCE" \
            --start-deadline-seconds "$TRIAL_START_DEADLINE_SECONDS" \
            --request-id "$GITHUB_RUN_ID" \
            > fallback_trial_result.json
          cat fallback_trial_result.json
        env:
          NOW: ${{ github.event.inputs.now }}
          TRIAL_PERMITTED_FIELDS: ${{ github.event.inputs.trial_permitted_fields }}
          TRIAL_FIXTURE_DISPATCH_STATUS_SEQUENCE: ${{ github.event.inputs.trial_fixture_dispatch_status_sequence }}
          TRIAL_START_DEADLINE_SECONDS: ${{ github.event.inputs.trial_start_deadline_seconds }}

      - name: Check the proof verdict (Structural Review Round 1, F4)
        # Deliberately no continue-on-error: a negative verdict here fails this job -- `ok:
        # true`/exit 0 from either trial step above is never, by itself, treated as a positive
        # proof (see scripts/runtime_observation_proof.py's own check-proof-verdict docstring).
        # Skipped (not run) if an earlier, non-continue-on-error step already failed the job --
        # the cleanup/export steps below still run regardless via their own `if: always()`.
        id: proof_verdict
        run: |
          python scripts/runtime_observation_proof.py check-proof-verdict \
            --actions-trial-result actions_trial_result.json \
            --fallback-trial-result fallback_trial_result.json \
            > proof_verdict_result.json
          cat proof_verdict_result.json

      - name: Export the isolated Store and grant for later, local, reviewed Evidence hand-off
        # PR #111 Structural Review Round 1, F3: this is the one bounded, non-secret bundle a
        # receiver later reopens LOCALLY (scripts/runtime_observation_proof.py
        # evidence-from-receipt) to hand the real, already-committed envelope this run produced
        # off to Evidence -- with zero new probe or observation call. Carries no SSH private
        # key (that lives only under ~/.ssh, never in these two directories) and no signing
        # private key (the in-RAM isolated Authority key this run generated was never written
        # to disk by scripts/runtime_observation_proof.py in the first place). Runs regardless
        # of the trials' own or the proof verdict's own outcome, so a failed trial is still
        # reviewable.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-actions-proof-store-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/isolated-proof-store
            ${{ runner.temp }}/isolated-proof-out
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove the trial-only SSH key and identity-selection config from this runner
        if: always()
        run: rm -f ~/.ssh/isolated_trial_proof_key ~/.ssh/known_hosts ~/.ssh/config

      - name: Publish result to job summary (host/user redacted)
        if: always()
        run: |
          {
