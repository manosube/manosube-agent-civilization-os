# MANOSUBE Agent Civilization OS
# Canonical Python project and tool contract.
#
# This file configures the build and verification surface.
# It does not define Objective, Authority, State, or Completion semantics.

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "manosube-agent-civilization-os"
version = "0.1.0.dev0"
description = "A state-centric canonical kernel for evidence-backed, authority-bounded software development cycles."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
authors = [
  { name = "SHUKOU" },
]
keywords = [
  "agent",
  "authority",
  "canonical-state",
  "civilization-os",
  "evidence",
  "lineage",
  "reflow",
  "state-machine",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Japanese",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/manosube/manosube-agent-civilization-os"
Repository = "https://github.com/manosube/manosube-agent-civilization-os"
Issues = "https://github.com/manosube/manosube-agent-civilization-os/issues"
Origin = "https://github.com/manosube/manosube-civilization-os"

# No [project.scripts] entry exists in v0.1.
# The local CLI is a v0.2 adapter and must not become part of the kernel early.

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.112,<7",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build]
include = [
  "src/manosube_agent_civilization/**/*.py",
  "src/manosube_agent_civilization/py.typed",
  "01_SCHEMA/**/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manosube_agent_civilization"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/NOTICE.md",
  "/ORIGIN.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/00_KERNEL",
  "/01_SCHEMA",
  "/03_BINDING",
  "/src",
  "/tests",
  "/examples",
]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
xfail_strict = true
filterwarnings = [
  "error",
]
markers = [
  "contract: validates a canonical contract or invariant",
  "integration: crosses two or more kernel components",
  "natural_cycle: proves an end-to-end canonical state cycle",
  "recovery: validates atomicity, quarantine, or reconstruction",
  "security: validates authority, boundary, secret, or trust controls",
  "slow: exceeds the normal unit-test latency budget",
]

[tool.coverage.run]
branch = true
source = ["manosube_agent_civilization"]
relative_files = true
parallel = true

[tool.coverage.paths]
source = [
  "src/manosube_agent_civilization",
  "*/site-packages/manosube_agent_civilization",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
precision = 2
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "build/coverage/html"

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.ruff]
required-version = ">=0.9.0"
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
  "build",
  "dist",
  ".manosube",
]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PIE",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]
ignore = [
  # Explicitly raised domain exceptions are clearer than forced message extraction.
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", # Assertions are the executable evidence language of the test suite.
]

[tool.ruff.lint.isort]
known-first-party = ["manosube_agent_civilization"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "dataclasses.field",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = false
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
